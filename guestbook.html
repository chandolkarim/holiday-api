<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한 줄 방명록 · Supabase 예제</title>
  <meta name="description" content="이름과 한 줄 인사를 남기면 Vercel 함수가 Supabase에 저장합니다.">
  <style>
    :root {
      --ink: #172033; --muted: #526173; --line: #d6dee7; --bg: #f4f7fa; --card: #ffffff;
      --brand: #005596; --teal: #0f766e; --warn-bg: #fff7ed; --warn-line: #fdba74; --warn-ink: #9a3412;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6; word-break: keep-all;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    header { background: #122b40; color: #fff; padding: 28px 20px 24px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 32px); line-height: 1.3; }
    header p { margin: 8px 0 0; color: #d7e3ec; }
    header a { color: #fff; }
    main { padding: 24px 20px 40px; }
    form {
      display: grid; grid-template-columns: 180px 1fr auto; gap: 12px; align-items: end;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    }
    label { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .counter { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
    .counter.over { color: var(--warn-ink); font-weight: 700; }
    input, button { width: 100%; height: 48px; font: inherit; border-radius: 10px; }
    input { border: 1px solid #9fb3c4; background: #fff; color: var(--ink); padding: 0 12px; min-width: 0; }
    button { border: 0; background: var(--brand); color: #fff; font-weight: 700; padding: 0 24px; cursor: pointer; }
    button:disabled { background: #6f8ca6; cursor: progress; }
    :focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    #notice { min-height: 24px; margin: 10px 2px 0; font-size: 15px; }
    #notice.ok { color: var(--teal); font-weight: 700; }
    #notice.bad { color: var(--warn-ink); font-weight: 700; }
    #result { margin-top: 12px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    .panel h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.4; }
    .panel h2, .panel p { overflow-wrap: anywhere; }
    .list { list-style: none; margin: 8px 0 0; padding: 0; }
    .list li { display: grid; grid-template-columns: minmax(80px, auto) 1fr auto; gap: 4px 14px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--line); }
    .who { font-weight: 700; color: var(--brand); overflow-wrap: anywhere; }
    .what { overflow-wrap: anywhere; white-space: pre-wrap; }
    .when { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .new { background: #e6f4f1; border-radius: 8px; }
    .loading { display: flex; align-items: center; gap: 12px; color: var(--muted); }
    .spinner { flex: none; width: 24px; height: 24px; border: 3px solid #cfe0ee; border-top-color: var(--brand); border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    .empty p { margin: 4px 0; color: var(--muted); }
    .error { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
    .error p { margin: 6px 0; }
    .error .hint { color: #7c2d12; font-size: 15px; }
    .error .code { font-size: 13px; color: #9a3412; }
    .retry { width: auto; height: 42px; margin-top: 8px; background: #9a3412; }
    footer { padding: 0 20px 32px; font-size: 13px; color: var(--muted); }
    footer a { color: #0b6a8a; }
    @media (max-width: 560px) {
      form { grid-template-columns: 1fr; }
      .list li { grid-template-columns: 1fr auto; }
      .what { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>한 줄 방명록</h1>
      <p>이름과 한 줄 인사를 남기면 Vercel 함수가 Supabase에 저장합니다. 최근 20개를 보여 줍니다.</p>
    </div>
  </header>
  <main class="wrap">
    <form id="write" novalidate>
      <div>
        <label for="name">이름 <span class="counter" id="name-count">0/20</span></label>
        <input id="name" name="name" autocomplete="nickname" maxlength="40" required>
      </div>
      <div>
        <label for="message">한 줄 인사 <span class="counter" id="message-count">0/200</span></label>
        <input id="message" name="message" autocomplete="off" maxlength="400" required>
      </div>
      <button id="submit" type="submit">남기기</button>
    </form>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="result" aria-live="polite" aria-busy="false"></section>
  </main>
  <footer class="wrap">저장소: Supabase 표 guestbook · 읽기는 누구나, 쓰기는 서버 함수만 · <a href="/">월별 공휴일 조회</a></footer>

  <script>
    const NAME_MAX = 20;
    const MESSAGE_MAX = 200;
    const CONTROL = /[\u0000-\u001F\u007F-\u009F\u2028\u2029]/;
    const form = document.getElementById('write');
    const nameInput = document.getElementById('name');
    const messageInput = document.getElementById('message');
    const submitButton = document.getElementById('submit');
    const notice = document.getElementById('notice');
    const result = document.getElementById('result');
    let items = [];

    // 작은 도우미: 태그를 만들고 글자는 textContent로 넣습니다(방문자 글을 HTML로 해석하지 않음)
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    const count = (text) => [...text].length; // 서버·DB와 같은 기준(이모지도 한 글자)
    function formatTime(iso) {
      return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })
        .format(new Date(iso));
    }
    function say(text, kind = '') {
      notice.className = kind;
      notice.textContent = text;
    }

    // 글자 수 표시
    function updateCounter(input, max, id) {
      const n = count(input.value.trim());
      const counter = document.getElementById(id);
      counter.textContent = `${n}/${max}`;
      counter.classList.toggle('over', n > max);
    }
    nameInput.addEventListener('input', () => updateCounter(nameInput, NAME_MAX, 'name-count'));
    messageInput.addEventListener('input', () => updateCounter(messageInput, MESSAGE_MAX, 'message-count'));

    // 네 가지 화면 상태: 불러오는 중 · 글 있음 · 글 없음 · 오류
    function showLoading() {
      result.setAttribute('aria-busy', 'true');
      const panel = el('div', 'panel loading');
      panel.append(el('span', 'spinner'), el('span', '', '방명록을 불러오는 중입니다…'));
      result.replaceChildren(panel);
    }
    function showList(highlightId) {
      result.setAttribute('aria-busy', 'false');
      if (items.length === 0) return showEmpty();
      const panel = el('div', 'panel');
      panel.append(el('h2', '', `최근 글 ${items.length}개`));
      const list = el('ul', 'list');
      for (const item of items) {
        const li = el('li', item.id === highlightId ? 'new' : '');
        li.append(el('span', 'who', item.name), el('span', 'what', item.message), el('span', 'when', formatTime(item.createdAt)));
        list.append(li);
      }
      panel.append(list);
      result.replaceChildren(panel);
    }
    function showEmpty() {
      result.setAttribute('aria-busy', 'false');
      const panel = el('div', 'panel empty');
      panel.append(el('h2', '', '아직 남긴 글이 없습니다'), el('p', '', '첫 번째 인사를 남겨 보세요.'));
      result.replaceChildren(panel);
    }
    function showError(message, hint, status) {
      result.setAttribute('aria-busy', 'false');
      const panel = el('div', 'panel error');
      panel.setAttribute('role', 'alert');
      panel.append(el('h2', '', '방명록을 불러오지 못했습니다'), el('p', '', message));
      if (hint) panel.append(el('p', 'hint', `확인할 점: ${hint}`));
      if (status) panel.append(el('p', 'code', `응답 코드 ${status}`));
      const retry = el('button', 'retry', '다시 시도');
      retry.type = 'button';
      retry.addEventListener('click', load);
      panel.append(retry);
      result.replaceChildren(panel);
    }
    function offlineHint() {
      return location.protocol === 'file:'
        ? '예제 폴더에서 node scripts/dev.mjs 를 실행하고 http://localhost:3000/guestbook.html 로 엽니다. 배포한 뒤에는 운영 주소로 엽니다.'
        : '인터넷 연결을 확인하고 다시 시도하세요.';
    }

    async function load() {
      showLoading();
      try {
        const response = await fetch('/api/guestbook', { cache: 'no-store' });
        const data = await response.json().catch(() => null);
        if (!response.ok || !data) return showError(data?.error || `서버가 ${response.status} 오류로 답했습니다.`, data?.hint, response.status);
        items = data.items;
        showList();
      } catch {
        showError('서버에 연결하지 못했습니다.', offlineHint(), 0);
      }
    }

    // 글쓰기: 화면에서 먼저 검사하고, 서버가 한 번 더 검사합니다
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      const message = messageInput.value.trim();
      if (count(name) < 1 || count(name) > NAME_MAX || CONTROL.test(name)) {
        say(`이름은 1~${NAME_MAX}자로 적습니다.`, 'bad');
        return nameInput.focus();
      }
      if (count(message) < 1 || count(message) > MESSAGE_MAX || CONTROL.test(message)) {
        say(`한 줄 인사는 1~${MESSAGE_MAX}자로 적습니다.`, 'bad');
        return messageInput.focus();
      }
      submitButton.disabled = true;
      say('저장하는 중입니다…');
      try {
        const response = await fetch('/api/guestbook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, message }),
        });
        const data = await response.json().catch(() => null);
        if (response.status === 201 && data?.item) {
          items = [data.item, ...items.filter((item) => item.id !== data.item.id)].slice(0, 20);
          showList(data.item.id);
          messageInput.value = '';
          updateCounter(messageInput, MESSAGE_MAX, 'message-count');
          say('남겼습니다. 고맙습니다!', 'ok');
        } else {
          say(data?.error || `저장하지 못했습니다(응답 코드 ${response.status}).`, 'bad');
        }
      } catch {
        say(`서버에 연결하지 못했습니다. ${offlineHint()}`, 'bad');
      } finally {
        submitButton.disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
